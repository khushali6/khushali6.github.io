name: Capture product screenshots
on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1'
  push:
    paths: ['tools/capture.mjs', '.github/workflows/screenshots.yml']
permissions:
  contents: write
  pages: write
jobs:
  shots:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm i --no-save playwright@1 && npx playwright install --with-deps chromium
      - run: node tools/capture.mjs
      - name: Commit screenshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/shots
          if git diff --cached --quiet; then echo "no changes"; exit 0; fi
          git commit -m "Update product screenshots"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || true
        env:
          GH_TOKEN: ${{ github.token }}
